workflows:
  meoz-apk:
    name: M.E.O.Z LABORATOIRE APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Générer le projet Android
        script: |
          flutter create . --platforms=android --org com.ziko.meoz --project-name meoz_laboratoire
      - name: Ajouter les permissions Android
        script: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Dépendances
        script: flutter pub get
      - name: Compiler l'APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
